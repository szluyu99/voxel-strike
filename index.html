<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Voxel Strike · 体素打击</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>
<canvas id="hud"></canvas>

<div id="menu" class="screen">
  <div class="panel">
    <h1>VOXEL STRIKE</h1>
    <p class="sub">体素打击 · 基于 Comanche (1992) Voxel Space 渲染</p>
    <div class="row"><label>地图</label>
      <select id="mapSelect"></select><button id="randomMap" class="small" title="随机地图">🎲</button></div>
    <div class="row"><label>难度</label>
      <select id="difficulty"><option value="easy">简单</option><option value="normal">普通</option><option value="hard">困难</option></select></div>
    <div class="row"><label>画质</label>
      <select id="quality"><option value="low">低（流畅）</option><option value="medium">中</option><option value="high">高</option></select></div>
    <div class="row"><label>鼠标灵敏度</label><input id="sens" type="range" min="0.3" max="2.5" step="0.1"></div>
    <div class="row"><label>反转 Y 轴</label><input id="invertY" type="checkbox"></div>
    <div class="row"><label>音量</label><input id="volume" type="range" min="0" max="1" step="0.05"></div>
    <button id="startBtn" class="primary">开始任务</button>
    <p class="hs">最高分 <b id="highScore">0</b> · 当前地图：<span id="mapName">-</span></p>
    <p id="error" class="error"></p>
    <details>
      <summary>操作说明</summary>
      <table class="keys">
        <tr><td>鼠标</td><td>转向 / 俯仰（点击画面锁定鼠标）</td></tr>
        <tr><td>W / S</td><td>前进 / 后退</td></tr>
        <tr><td>A / D</td><td>左右平移</td></tr>
        <tr><td>Q / E 或 ← / →</td><td>转向</td></tr>
        <tr><td>空格 / 左 Shift</td><td>上升 / 下降</td></tr>
        <tr><td>T / G</td><td>抬头 / 低头</td></tr>
        <tr><td>B</td><td>加速</td></tr>
        <tr><td>左键 / J</td><td>机炮（注意过热）</td></tr>
        <tr><td>右键 / K</td><td>火箭弹（范围伤害）</td></tr>
        <tr><td>X</td><td>干扰弹（诱骗导弹）</td></tr>
        <tr><td>P / Esc</td><td>暂停</td></tr>
      </table>
      <p class="tip">提示：离地 18 以下时防空雷达无法锁定你。击毁敌人可能掉落修理包（绿）与弹药箱（黄）。</p>
    </details>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="panel">
    <h2>已暂停</h2>
    <button id="resumeBtn" class="primary">继续</button>
    <button id="quitBtn">返回菜单</button>
  </div>
</div>

<div id="gameover" class="screen hidden">
  <div class="panel">
    <h2 id="goTitle">任务失败</h2>
    <p id="goStats"></p>
    <button id="againBtn" class="primary">再来一局</button>
    <button id="menuBtn">返回菜单</button>
  </div>
</div>

<div id="loading" class="hidden">正在加载地形…</div>

<div id="touch">
  <div id="stickL" class="stick"><div class="knob"></div></div>
  <div id="stickR" class="stick"><div class="knob"></div></div>
  <div class="btns">
    <button data-btn="flare">干扰</button>
    <button data-btn="rocket">火箭</button>
    <button data-btn="fire">机炮</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
